<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Skilling</title>
    <meta name="description" content="Skilling connects your ambition to the exact capabilities, proof, and opportunities that move you forward." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      /* Apply the saved theme before first paint (defaults to dark) to avoid a light flash.
         Must match the AppProvider key/format; React re-syncs the class after mount. */
      try {
        var t = JSON.parse(localStorage.getItem("skilling-theme") || '"dark"').replace(/"/g, "");
        if (t === "dark") document.documentElement.classList.add("dark");
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
